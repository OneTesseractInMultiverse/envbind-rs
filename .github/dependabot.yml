version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # 0.8.3 uses a Rust 1.87 API; keep the Rust 1.85 contract (PR #30).
    # Exact requirement: future fixed releases must remain eligible.
    ignore:
      - dependency-name: yoke-derive
        versions: ["=0.8.3"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Keep this workspace aligned with the root compatibility constraint.
    ignore:
      - dependency-name: yoke-derive
        versions: ["=0.8.3"]

  - package-ecosystem: pip
    directory: /.github/tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
