name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  workflow-tests:
    name: Release workflow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install workflow test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/workflow-tests"
          "$RUNNER_TEMP/workflow-tests/bin/python3" -m pip install -r .github/tests/requirements.txt

      - name: Install Rust for release fixtures
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Test release workflow
        run: '"$RUNNER_TEMP/workflow-tests/bin/python3" -B -m unittest discover -s .github/tests -v'

  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    env:
      # Exercise the newest graph on stable and the supported graph on the MSRV.
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: ${{ matrix.toolchain == 'stable' && 'allow' || 'fallback' }}
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - "1.85.0"
          - stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component clippy,rustfmt
          rustup default "${{ matrix.toolchain }}"

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version

      - name: Check formatting
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --all-targets

      - name: Lint
        if: matrix.toolchain == 'stable'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Test docs
        run: cargo test --doc

      - name: Build docs
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
        run: cargo doc --no-deps --all-features

      - name: Inspect package contents
        if: matrix.toolchain == 'stable'
        run: cargo package --list

      - name: Package
        if: matrix.toolchain == 'stable'
        run: cargo package

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit dependencies
        run: |
          for resolution in fallback allow; do
            CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS="$resolution" cargo generate-lockfile
            cargo audit
          done
          rm -f Cargo.lock
