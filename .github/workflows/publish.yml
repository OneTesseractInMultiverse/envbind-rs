name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.1 or refs/tags/v0.1.1"
        required: true
        type: string
      publish:
        description: "Publish to crates.io instead of running validation only"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - name: Validate release tag input
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: python
        run: |
          import os
          import re
          import subprocess
          import sys

          event = os.environ["EVENT_NAME"]
          if event == "workflow_dispatch":
              tag = os.environ["INPUT_TAG"].removeprefix("refs/tags/")
          elif event == "release":
              tag = os.environ["RELEASE_TAG"]
          else:
              sys.exit("::error::Unsupported release event")

          number = r"(?:0|[1-9][0-9]*)"
          identifier = r"[0-9A-Za-z-]+"
          pattern = (
              rf"v{number}\.{number}\.{number}"
              rf"(?:-(?P<pre>{identifier}(?:\.{identifier})*))?"
              rf"(?:\+{identifier}(?:\.{identifier})*)?"
          )
          match = re.fullmatch(pattern, tag)
          if match is None or any(
              part.isdigit() and len(part) > 1 and part.startswith("0")
              for part in (match.group("pre") or "").split(".")
          ):
              sys.exit("::error::Invalid release tag; expected vMAJOR.MINOR.PATCH with optional SemVer suffixes")

          ref = f"refs/tags/{tag}"
          if subprocess.run(["git", "check-ref-format", ref], capture_output=True).returncode:
              sys.exit("::error::Invalid release tag; not a valid Git tag ref")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={tag}\nref={ref}\n")

  validate:
    name: Validate release package
    needs: resolve-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.resolve-tag.outputs.ref }}
          persist-credentials: false

      - name: Check tag matches Cargo.toml version
        env:
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
        shell: python
        run: |
          import os
          import subprocess
          import sys
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          if tag != f"v{version}":
              sys.exit("::error::Release tag does not match Cargo.toml version")

          def commit(ref):
              result = subprocess.run(
                  ["git", "rev-parse", "--verify", ref],
                  capture_output=True, text=True,
              )
              if result.returncode:
                  sys.exit("::error::Release tag must exist and point to a commit")
              return result.stdout.strip()

          if commit(f"refs/tags/{tag}^{{commit}}") != commit("HEAD"):
              sys.exit("::error::Checked-out commit does not match the release tag")

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.1

      - name: Audit dependencies
        run: |
          cargo generate-lockfile
          cargo audit
          rm -f Cargo.lock

      - name: Verify
        run: make verify

      - name: Inspect package contents
        run: make package-list

      - name: Package
        run: make package

      - name: Publish dry run
        run: make publish-dry-run

      - name: Upload crate package
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: envbind-crate
          path: target/package/*.crate
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs: [resolve-tag, validate]
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.resolve-tag.outputs.ref }}
          persist-credentials: false

      - name: Check tag matches Cargo.toml version
        env:
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
        shell: python
        run: |
          import os
          import subprocess
          import sys
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          if tag != f"v{version}":
              sys.exit("::error::Release tag does not match Cargo.toml version")

          def commit(ref):
              result = subprocess.run(
                  ["git", "rev-parse", "--verify", ref],
                  capture_output=True, text=True,
              )
              if result.returncode:
                  sys.exit("::error::Release tag must exist and point to a commit")
              return result.stdout.strip()

          if commit(f"refs/tags/{tag}^{{commit}}") != commit("HEAD"):
              sys.exit("::error::Checked-out commit does not match the release tag")

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish
