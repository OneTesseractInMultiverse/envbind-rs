[package]
name = "envbind"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Typed environment binding primitives for Rust services."
readme = "README.md"
license = "MIT"
documentation = "https://docs.rs/envbind"
repository = "https://github.com/OneTesseractInMultiverse/envbind-rs"
authors = ["Pedro Guzmán"]
keywords = ["configuration", "environment", "settings", "config", "rust"]
categories = ["config", "development-tools"]
include = [
  "CHANGELOG.md",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "Cargo.toml",
  "SECURITY.md",
  "docs/**",
  "examples/**",
  "LICENSE",
  "Makefile",
  "README.md",
  "SUPPORT.md",
  "src/**",
  "tests/**",
]

[lib]
name = "envbind"
path = "src/lib.rs"

[[test]]
name = "error_exit"
harness = false

[[test]]
name = "process_environment"
harness = false

[package.metadata.docs.rs]
all-features = true
targets = []
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Keep the existing safe scalar decoder; the new SIMD engines are not used.
base64 = { version = "0.23", default-features = false, features = ["std"] }
regex = "1"
serde_json = "1"
url = "2.5.8"
# Keep url's ICU derive dependency compatible with Rust 1.85. Version 0.8.3
# uses str::from_utf8 without declaring the newer Rust requirement. Remove
# this constraint once a compatible upstream release passes the MSRV tests.
yoke-derive = "=0.8.2"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unused_lifetimes = "deny"
unused_qualifications = "warn"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unwrap_used = "deny"
