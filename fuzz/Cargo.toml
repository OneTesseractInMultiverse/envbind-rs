[package]
name = "envbind-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
envbind = { path = ".." }
libfuzzer-sys = "=0.4.13"
base64 = { version = "0.23", default-features = false, features = ["std"] }
serde_json = "1"

# Keep nightly fuzz tooling outside the library's stable/MSRV workspace.
[workspace]
members = ["."]

[[bin]]
name = "json"
path = "fuzz_targets/json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "base64"
path = "fuzz_targets/base64.rs"
test = false
doc = false
bench = false

[[bin]]
name = "list"
path = "fuzz_targets/list.rs"
test = false
doc = false
bench = false

[[bin]]
name = "url"
path = "fuzz_targets/url.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scalars"
path = "fuzz_targets/scalars.rs"
test = false
doc = false
bench = false
